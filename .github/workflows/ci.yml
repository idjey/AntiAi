name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: antiai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configure AWS Credentials for KMS Testing
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/ci-kms-signer-role
          aws-region: us-east-1

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma migrations
        run: |
          cd packages/database
          cat << 'EOF' > .env
          DATABASE_URL="postgresql://postgres:password@localhost:5432/antiai"
          EOF
          npx prisma migrate deploy
          npx prisma generate
          cd ../..
          npm run build:packages

      - name: Verify Config
        run: |
          cd apps/api
          cat << 'EOF' > .env
          DATABASE_URL="postgresql://postgres:password@localhost:5432/antiai"
          EOF
          node fix_db_config_v2.js

      - name: Run all tests
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/antiai"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "ci-test-secret"
          GOOGLE_CLIENT_ID: "mock-google-client-id"
          GOOGLE_CLIENT_SECRET: "mock-google-client-secret"
          GOOGLE_CALLBACK_URL: "http://localhost:4000/v1/auth/google/callback"
          SIGNING_KEY_ID: "test-key-id"
          SIGNING_PUBLIC_KEY_B64: "MCowBQYDK2VwAyEA0DX42yHDP8akoN3pg9LQzfYxQWxezPyvoR5BbTEXRYU="
          SIGNING_PRIVATE_KEY_B64: "MC4CAQAwBQYDK2VwBCIEIHM11+KG4g2twRipTZFDRIKLbvq5wegfzCleaIaa+utp"
        run: npm run test -- --coverage && npm run test:e2e -w apps/api && npm run test:e2e -w apps/provenance-worker

      - name: Install Playwright Browsers and ffmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          cd apps/web
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/antiai"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "ci-test-secret"
          GOOGLE_CLIENT_ID: "mock-google-client-id"
          GOOGLE_CLIENT_SECRET: "mock-google-client-secret"
          GOOGLE_CALLBACK_URL: "http://localhost:4000/v1/auth/google/callback"
          SIGNING_KEY_ID: "test-key-id"
          SIGNING_PUBLIC_KEY_B64: "MCowBQYDK2VwAyEA0DX42yHDP8akoN3pg9LQzfYxQWxezPyvoR5BbTEXRYU="
          SIGNING_PRIVATE_KEY_B64: "MC4CAQAwBQYDK2VwBCIEIHM11+KG4g2twRipTZFDRIKLbvq5wegfzCleaIaa+utp"
        run: |
          # Start the backend API in the background
          cd apps/api
          npm run dev &
          
          # Wait for API to be ready (ping /health)
          echo "Waiting for API to start..."
          timeout 60 bash -c 'until curl -s http://localhost:4000/health | grep -q "ok"; do sleep 1; done'
          echo "API is ready"
          
          # Start Next.js dev server (works with any output mode including standalone)
          cd ../web
          npx next dev &
          
          echo "Waiting for Next.js to start..."
          timeout 60 bash -c 'until curl -s http://localhost:3000 > /dev/null 2>&1; do sleep 1; done'
          echo "Next.js is ready"
          
          npx playwright test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
